version: "3.8"

networks:
  proxy:
    external: true

volumes:
  open-webui-data:

services:
  # =========================
  # OPEN WEBUI
  # =========================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # Optional OpenAI-compatible backend
      # - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`${OPEN_WEBUI_HOST}`)"
      - "traefik.http.routers.open-webui.entrypoints=web"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

  # =========================
  # MCPO (MCP → OpenAPI proxy)
  # =========================
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    # Limit restart attempts to prevent veth interface exhaustion on failure loops
    restart: on-failure:5
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command:
      - "--port"
      - "8000"
      - "--api-key"
      - "${MCPO_API_KEY}"
      - "--config"
      - "/config/config.json"
      - "--hot-reload"
    volumes:
      - ./mcpo-config:/config
    labels:
      - "traefik.enable=false"
